  # ---------------- Neuroscience ----------------
  - id: NEU-001
    claim: "Adult Drosophila MB has ~2,000 KCs, 34 MBONs (21 cell types), ~130 DANs (20 types); PN→KC connectivity is ~7 claws per KC."
    domain: neuroscience
    source: "Aso et al. 2014, Cell 157(3):e-data; PMC8975552 (Gkanias 2022) re-check"
    source_type: primary
    version: "Aso 2014"
    confidence: HIGH
    implementation_status: conflicts
    affected_files: [brain/connectome.py]
    validation_needed: "decide: scale to biology or rename as bio-inspired"
    notes: "Project: 4064 KCs / 97 MBONs / 344 DANs — these are MaleCNS whole-CNS counts, not adult MB counts. Encoder itself uses 64 PN channels, fewer than Aso's ~150 glomeruli PN types."

  - id: NEU-002
    claim: "Gkanias et al. 2022 (eLife, PMC8975552) 'incentive circuit' DPR is NOT reward prediction error; it maximizes separation of reinforced inputs via 4 synaptic effects (depression/potentiation/recovery/saturation)."
    domain: neuroscience
    source: "Gkanias, Ruta, Randuniene, Chittka 2022, eLife 11:e75611 / PMC8975552"
    source_type: primary
    version: "2022"
    confidence: HIGH
    implementation_status: conflicts
    affected_files: [brain/dopamine_plasticity.py]
    validation_needed: "relabel the rule in docs or implement actual DPR"
    notes: "Project's DPR is a simplified dopamine-gated Hebbian rule (lr 0.01, delta = lr·outer(active KC, dan_gate)); naming it 'DPR' overstates fidelity to the cited literature."

  - id: NEU-003
    claim: "Sparse KC coding with ~10% active fraction and APL-like WTA is biologically supported (Aso 2014; KC odor responses are sparse and selective)."
    domain: neuroscience
    source: "Aso et al. 2014; ModA/Moon 2021 reviews"
    source_type: primary
    confidence: HIGH
    implementation_status: implemented
    affected_files: [brain/mushroom_body.py]
    validation_needed: no
    notes: "winner_take_all(keep_fraction=0.10) on 4064 KCs ≈ 406 active — plausible sparsity."

  - id: NEU-004
    claim: "MB memory phases: γ lobe labile STM, αβ stable LTM; consolidation = relaxation toward decaying equilibrium is an ENGINEERING APPROXIMATION, not a biological mechanism."
    domain: neuroscience
    source: "Aso 2014 (anatomy) + engineering choice in code"
    source_type: primary
    confidence: MED
    implementation_status: implemented
    affected_files: [brain/dopamine_plasticity.py]
    validation_needed: no
    notes: "ltm_decay 0.9995, consolidation 0.5 are free parameters with no biological anchor."

  - id: NEU-005
    claim: "DANs are organized in PAM (appetitive) and PPL1 (aversive) clusters projecting to specific MB compartments; per-compartment valence mapping is biologically supported."
    domain: neuroscience
    source: "Aso et al. 2014; Claridge-Chang 2009; Burke 2012"
    source_type: primary
    confidence: HIGH
    implementation_status: partial
    affected_files: [brain/dopamine_plasticity.py]
    validation_needed: no
    notes: "Code's signed half-split (first half PAM, second half PPL1) is decorative: dan_to_mbon is a fixed random matrix, so per-DAN valence structure has no functional consequence beyond a scalar gate."

